name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asset_management
          POSTGRES_USER: asset_management
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asset_management -d asset_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://asset_management:ci-password@localhost:5432/asset_management
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply schema and seed data
        env:
          PGPASSWORD: ci-password
        run: |
          for f in db/init/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U asset_management -d asset_management -q -f "$f"
          done

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
